# skill.<name>: on | off. <name> as /context lists it under Skills; a plugin's
#   skill as <plugin>:<skill>; anthropic-skills covers every anthropic-skills:* skill.
skill.dataviz=off
skill.code-review=on
skill.claude-api=off
skill.update-config=off
skill.claude-approvals=off
skill.loop=off
skill.run=off
skill.plugin-authoring=off
skill.keybindings-help=off
skill.workflow-authoring=off
skill.simplify=on
skill.fewer-permission-prompts=off
skill.init=on
skill.security-review=on
skill.audit-docs=on
skill.agent-workflows:design-visual-flow=on
skill.agent-workflows:do-task=on
skill.agent-workflows:draw-ascii-diagrams=on
skill.agent-workflows:draw-svg-diagrams=on
skill.agent-workflows:file-issue=on
skill.agent-workflows:gen-readme=on
skill.agent-workflows:land-pr=on
skill.agent-workflows:open-pr=on
skill.agent-workflows:outline-test-cases=on
skill.agent-workflows:remove-stale-files=on
skill.agent-workflows:reporting-outcomes=on
skill.agent-workflows:review-readme=on
skill.agent-workflows:reviewing-script-comments=on
skill.agent-workflows:reviewing-typography=on
skill.agent-workflows:rewrite-phrasing=on
skill.agent-workflows:skill-structure=on
skill.agent-workflows:studying-phrasing=on
skill.agent-workflows:write-release-notes=on
skill.anthropic-skills=off

# plugin.<name>@<marketplace>: on | off, the key as /plugin lists it.
plugin.agent-workflows@agent-workflows=on
plugin.agents-md@builtin=on
plugin.cc-plugin-diff@builtin=on
plugin.cc-plugin-easel@builtin=off
plugin.cc-plugin-plugin-authoring@builtin=on
plugin.cc-plugin-privacy@builtin=on
plugin.cc-plugin-promos@builtin=off
plugin.telemetry@builtin=off

# mcp.<name>: on | off, the name as /mcp lists it; claude-ai-connectors covers
#   every claude.ai connector.
mcp.playwright=off
mcp.claude-ai-connectors=off

# feature.<name>: on | off.
feature.auto-compact=on
feature.tool-search=on
feature.claude-md=on
feature.auto-memory=off
feature.attribution-header=off
feature.error-reporting=off
feature.feedback=off
feature.auto-update=off
feature.auto-mode-server=off
feature.total-tokens-reminder=off
