# url: an Ollama server, http://host:port or https://host:port.
url=http://localhost:11434

# model: a model on the server with the tools capability.
model=gemma4:26b

# context_length: a token count above 0, plain (65536) or in units of 1024 with k
#   (64k), up to the model's trained length.
context_length=64k
