# claude-ollama config: `make config` copies this to ~/.config/claude-ollama/config.
# Each key is required, unless the command line or its CLAUDE_OLLAMA_* variable sets it.

# url: the Ollama server, http://host:port or https://host:port.
url=http://localhost:11434

# model: any model on the server with the tools capability (see `ollama show <model>`).
model=gemma4:26b

# context_length: tokens, as a count (65536) or in units of 1024 (64k), up to the
#   model's trained length. Each new value creates <model>-<N>k once, and switching
#   between values loads the model again.
context_length=64k
